name: Keep VeloTok awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 https://velotok-bot.onrender.com/health
